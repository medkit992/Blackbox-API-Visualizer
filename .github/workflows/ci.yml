name: CI

on:
  push:
    branches: [main, feat/0.3.0-request-debugger-ui]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Run tests when configured
        run: npm run test --if-present

      - name: Build extension
        run: npm run build

      - name: Verify extension bundle
        run: |
          test -f dist/manifest.json
          test -f dist/src/devtools/devtools.html
          test -f dist/src/panel/panel.html

      - name: Upload extension bundle
        uses: actions/upload-artifact@v4
        with:
          name: blackbox-extension
          path: dist
          if-no-files-found: error
