name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Run tests when configured
        run: npm run test --if-present
      - name: Build extension
        run: npm run build
      - name: Verify extension bundle
        run: |
          test -f dist/manifest.json
          test -f dist/src/devtools/devtools.html
          test -f dist/src/panel/panel.html
      - name: Setup browser regression runner
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install browser test dependencies
        run: |
          python -m pip install playwright==1.51.1
          python -m playwright install --with-deps chromium
      - name: Check lifecycle component and production workspace
        env:
          WORKSPACE_QA_OUTPUT: workspace-qa
        run: |
          python tests/browser/request-lifecycle.browser.py
          python tests/browser/workspace.browser.py
      - name: Upload workspace regression evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: workspace-regression
          path: workspace-qa
          if-no-files-found: ignore
      - name: Upload extension bundle
        uses: actions/upload-artifact@v4
        with:
          name: blackbox-extension
          path: dist
          if-no-files-found: error
