name: Sync v0.5.0 lockfile version

on:
  push:
    branches:
      - feature/v0.5.0-request-lifecycle

permissions:
  contents: write

jobs:
  sync-lock-version:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/v0.5.0-request-lifecycle

      - name: Update only root lockfile version metadata
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const path = 'package-lock.json';
          const lock = JSON.parse(fs.readFileSync(path, 'utf8'));
          lock.version = '0.5.0';
          if (!lock.packages || !lock.packages['']) throw new Error('package-lock root package is missing');
          lock.packages[''].version = '0.5.0';
          fs.writeFileSync(path, JSON.stringify(lock, null, 2) + '\n');
          NODE

      - name: Commit regenerated metadata
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "package-lock.json already synchronized"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "chore: sync package-lock version to v0.5.0"
          git push origin HEAD:feature/v0.5.0-request-lifecycle
