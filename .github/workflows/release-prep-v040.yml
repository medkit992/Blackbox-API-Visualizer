name: Prepare v0.4.0 metadata

on:
  push:
    branches:
      - feature/request-stories-rework

permissions:
  contents: write

jobs:
  bump-version:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/request-stories-rework
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Align 0.4.0 package and manifest versions
        shell: bash
        run: |
          npm version 0.4.0 --no-git-tag-version
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const path = 'public/manifest.json';
          const manifest = JSON.parse(fs.readFileSync(path, 'utf8'));
          manifest.version = '0.4.0';
          fs.writeFileSync(path, `${JSON.stringify(manifest, null, 2)}\n`);
          NODE

      - name: Commit aligned version metadata
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json public/manifest.json
          if git diff --cached --quiet; then
            echo "Version metadata already aligned."
            exit 0
          fi
          git commit -m "release: bump version metadata to v0.4.0"
          git push origin HEAD:feature/request-stories-rework
