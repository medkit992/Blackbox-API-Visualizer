name: Final v0.3.0 release validation

on:
  push:
    branches: [feat/0.3.0-request-debugger-ui]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Run tests
        run: npm test

      - name: Build and verify extension
        run: npm run build

      - name: Verify release versions
        run: |
          test "$(node -p "require('./package.json').version")" = "0.3.0"
          test "$(node -p "require('./package-lock.json').version")" = "0.3.0"
          test "$(node -p "require('./package-lock.json').packages[''].version")" = "0.3.0"
          test "$(node -p "require('./public/manifest.json').version")" = "0.3.0"
          test "$(node -p "require('./dist/manifest.json').version")" = "0.3.0"

      - name: Verify Chrome Web Store ZIP layout
        run: |
          (cd dist && zip -qr ../blackbox-api-visualizer-v0.3.0.zip .)
          unzip -l blackbox-api-visualizer-v0.3.0.zip | grep -E '(^| )manifest.json$'
          test "$(unzip -p blackbox-api-visualizer-v0.3.0.zip manifest.json | node -e "let s='';process.stdin.on('data',d=>s+=d);process.stdin.on('end',()=>process.stdout.write(JSON.parse(s).version))")" = "0.3.0"
          if unzip -l blackbox-api-visualizer-v0.3.0.zip | grep -q ' dist/'; then
            echo 'ZIP unexpectedly contains a dist/ parent directory'
            exit 1
          fi

      - name: Release candidate validated
        run: echo "v0.3.0 release candidate validation complete"
